<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 115">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d47a"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Shield body fill -->
  <path d="M50 5 L88 20 L88 56 Q88 84 50 110 Q12 84 12 56 L12 20 Z"
        fill="rgba(0,212,122,0.10)" stroke="url(#g)" stroke-width="2.8"
        stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Inner shield ring -->
  <path d="M50 16 L78 27 L78 54 Q78 76 50 97 Q22 76 22 54 L22 27 Z"
        fill="rgba(0,212,122,0.05)" stroke="rgba(0,212,122,0.20)" stroke-width="1"/>
  <!-- Checkmark -->
  <path d="M31 55 L44 68 L69 40"
        stroke="url(#g)" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
</svg>
