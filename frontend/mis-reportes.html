<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis reportes — Santa Cruz Segura</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    :root{--cyan:#00d47a;--cyan-dim:rgba(0,212,122,.1);--border:rgba(255,255,255,.07);--border-acc:rgba(0,212,122,.2);--bg:#060e0a;--surface:rgba(255,255,255,.04);--text:#f1f5f9;--muted:#64748b;--sidebar-w:252px;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);margin:0;}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,212,122,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,122,.025) 1px,transparent 1px);background-size:60px 60px;}

    .sidebar{width:var(--sidebar-w);height:100vh;background:rgba(2,14,7,.97);border-right:1px solid var(--border);position:fixed;top:0;left:0;z-index:1045;display:flex;flex-direction:column;backdrop-filter:blur(20px);}
    .sidebar-brand{padding:1.2rem 1.1rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:.65rem;}
    .sidebar-logo{width:34px;height:34px;border-radius:8px;background:var(--cyan-dim);border:1px solid var(--border-acc);display:flex;align-items:center;justify-content:center;font-size:.9rem;color:var(--cyan);flex-shrink:0;box-shadow:0 0 10px rgba(0,212,122,.15);}
    .sb-name{color:var(--text);font-weight:700;font-size:.86rem;line-height:1.2;}
    .sb-sub{color:#94a3b8;font-size:.65rem;letter-spacing:.04em;}
    .sidebar-nav{flex:1;overflow-y:auto;padding:.5rem 0;}
    .nav-link{color:rgba(255,255,255,.5);padding:.55rem .9rem;border-radius:9px;margin:.05rem .4rem;display:flex;align-items:center;gap:.6rem;font-size:.82rem;font-weight:500;text-decoration:none;transition:all .18s;position:relative;}
    .nav-link i{font-size:.88rem;width:16px;text-align:center;}
    .nav-link:hover{color:var(--text);background:var(--surface);}
    .nav-link.active{color:var(--cyan);background:var(--cyan-dim);border:1px solid rgba(0,212,122,.12);}
    .nav-link.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;background:var(--cyan);border-radius:0 2px 2px 0;box-shadow:0 0 8px var(--cyan);}
    .sidebar-footer{padding:.85rem 1.1rem;border-top:1px solid var(--border);flex-shrink:0;}
    .btn-logout{background:none;border:1px solid var(--border);color:#94a3b8;border-radius:7px;padding:.3rem .7rem;font-size:.75rem;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;width:100%;}
    .btn-logout:hover{border-color:#f87171;color:#f87171;}

    .mobile-topbar{display:none;position:fixed;top:0;left:0;right:0;height:52px;background:rgba(2,14,7,.97);border-bottom:1px solid var(--border);z-index:1050;align-items:center;justify-content:space-between;padding:0 1rem;backdrop-filter:blur(20px);}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1044;}
    .sidebar-overlay.open{display:block;}

    .main-content{margin-left:var(--sidebar-w);padding:1.5rem;position:relative;z-index:1;}

    .form-select{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:var(--text);border-radius:9px;}
    .form-select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,122,.12);background:rgba(255,255,255,.06);color:var(--text);}
    .form-select option{background:#081a10;}

    .filter-bar{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:.75rem 1rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;}

    .reporte-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:14px;padding:1.1rem 1.25rem;transition:all .2s;position:relative;overflow:hidden;}
    .reporte-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
    .reporte-card.riesgo-bajo::before{background:linear-gradient(90deg,#34d399,transparent);}
    .reporte-card.riesgo-medio::before{background:linear-gradient(90deg,#fbbf24,transparent);}
    .reporte-card.riesgo-alto::before{background:linear-gradient(90deg,#f87171,transparent);}
    .reporte-card.riesgo-critico::before{background:linear-gradient(90deg,#a78bfa,transparent);}
    .reporte-card:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3);}

    .tipo-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;}
    .tipo-robo-dom{background:rgba(248,113,113,.1);color:#f87171;}
    .tipo-robo-tra{background:rgba(251,191,36,.1);color:#fbbf24;}
    .tipo-hurto{background:rgba(251,191,36,.08);color:#fcd34d;}
    .tipo-violencia{background:rgba(248,113,113,.12);color:#f87171;}
    .tipo-sospechoso{background:rgba(0,212,122,.08);color:#00d47a;}
    .tipo-vandalismo{background:rgba(167,139,250,.1);color:#a78bfa;}
    .tipo-otro{background:rgba(255,255,255,.05);color:#94a3b8;}

    .estado-badge{font-size:.68rem;font-weight:700;padding:.18rem .55rem;border-radius:20px;display:inline-flex;align-items:center;gap:.28rem;white-space:nowrap;}
    .estado-pendiente{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.2);}
    .estado-verificado{background:rgba(96,165,250,.12);color:#60a5fa;border:1px solid rgba(96,165,250,.2);}
    .estado-resuelto{background:rgba(52,211,153,.12);color:#34d399;border:1px solid rgba(52,211,153,.2);}
    .estado-descartado{background:rgba(255,255,255,.06);color:#64748b;border:1px solid rgba(255,255,255,.08);}

    .nivel-pill{font-size:.65rem;font-weight:700;padding:.15rem .45rem;border-radius:20px;display:inline-block;}
    .nivel-bajo{background:rgba(52,211,153,.12);color:#34d399;}
    .nivel-medio{background:rgba(251,191,36,.12);color:#fbbf24;}
    .nivel-alto{background:rgba(248,113,113,.12);color:#f87171;}
    .nivel-critico{background:rgba(167,139,250,.12);color:#a78bfa;}

    .btn-nuevo{background:linear-gradient(135deg,rgba(0,212,122,.9),rgba(0,212,122,.7));border:none;color:#060e0a;font-weight:700;font-size:.82rem;padding:.4rem .9rem;border-radius:9px;box-shadow:0 0 16px rgba(0,212,122,.2);transition:all .18s;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;}
    .btn-nuevo:hover{box-shadow:0 0 28px rgba(0,212,122,.4);color:#060e0a;}

    .empty-state{text-align:center;padding:4rem 1rem;}
    .empty-state i{font-size:2.5rem;color:#94a3b8;display:block;margin-bottom:.75rem;}

    @media(max-width:991.98px){
      .sidebar{transform:translateX(-100%);transition:transform .28s ease;width:270px;}
      .sidebar.open{transform:translateX(0);box-shadow:0 0 60px rgba(0,0,0,.6);}
      .mobile-topbar{display:flex;}
      .main-content{margin-left:0;padding:1rem;padding-top:calc(52px + 1rem);}
    }
    @media(max-width:575.98px){
      .main-content{padding:.75rem;padding-top:calc(52px + .75rem);}
    }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<div class="mobile-topbar">
  <button class="btn text-white p-1 lh-1 border-0 bg-transparent" onclick="openSidebar()"><i class="bi bi-list fs-3"></i></button>
  <span class="fw-bold text-white" style="font-size:.88rem">Mis reportes</span>
  <span style="width:32px"></span>
</div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-brand d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-2">
      <div class="sidebar-logo"><img src="assets/logo.svg" alt="SCS" style="width:22px;height:22px;"/></div>
      <div><div class="sb-name">Santa Cruz</div><div class="sb-sub">SEGURA PREDICTIVA</div></div>
    </div>
    <button class="btn text-white p-0 d-lg-none lh-1 border-0 bg-transparent" onclick="closeSidebar()">
      <i class="bi bi-x-lg" style="font-size:.9rem"></i>
    </button>
  </div>
  <nav class="sidebar-nav">
    <a href="dashboard.html" class="nav-link" onclick="closeSidebar()"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="reportar.html" class="nav-link" onclick="closeSidebar()"><i class="bi bi-exclamation-triangle"></i> Reportar</a>
    <a href="mis-reportes.html" class="nav-link active" onclick="closeSidebar()"><i class="bi bi-list-check"></i> Mis reportes</a>
    <a href="alertas.html" class="nav-link" onclick="closeSidebar()"><i class="bi bi-bell"></i> Alertas</a>
    <a href="admin.html" class="nav-link d-none" id="link-admin" onclick="closeSidebar()"><i class="bi bi-people"></i> Usuarios</a>
  </nav>
  <div class="sidebar-footer">
    <button id="btn-logout" class="btn-logout">
      <i class="bi bi-box-arrow-left me-1"></i>Cerrar sesión
    </button>
  </div>
</div>

<div class="main-content">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
      <h5 class="fw-bold mb-0">Mis reportes</h5>
      <small style="color:#94a3b8"><i class="bi bi-list-check me-1"></i>Historial de incidentes que has reportado</small>
    </div>
    <a href="reportar.html" class="btn-nuevo"><i class="bi bi-plus-circle"></i>Nuevo reporte</a>
  </div>

  <div class="filter-bar">
    <select id="filtro-estado" class="form-select form-select-sm" style="max-width:170px">
      <option value="">Todos los estados</option>
      <option value="pendiente">Pendiente</option>
      <option value="verificado">Verificado</option>
      <option value="resuelto">Resuelto</option>
      <option value="descartado">Descartado</option>
    </select>
    <span style="font-size:.8rem;color:#94a3b8;margin-left:auto" id="total-label">Cargando…</span>
  </div>

  <div id="reportes-grid" class="row g-3">
    <div class="col-12 text-center py-5" style="color:#94a3b8">
      <div class="spinner-border spinner-border-sm me-2" style="color:var(--cyan)"></div>Cargando tus reportes…
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  requireAuth();

  const user = getUser();
  if (user?.id_rol === 4) document.getElementById('link-admin')?.classList.remove('d-none');

  function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebar-overlay').classList.add('open');}
  function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebar-overlay').classList.remove('open');}

  const TIPO_ICON = {
    'Robo a domicilio':   ['bi-house-exclamation','tipo-robo-dom'],
    'Robo a transeúnte':  ['bi-person-exclamation','tipo-robo-tra'],
    'Hurto':              ['bi-bag-x','tipo-hurto'],
    'Violencia':          ['bi-exclamation-octagon','tipo-violencia'],
    'Persona sospechosa': ['bi-eye','tipo-sospechoso'],
    'Vandalismo':         ['bi-hammer','tipo-vandalismo'],
    'Otro':               ['bi-question-circle','tipo-otro'],
  };
  const NIVEL_CLS   = { bajo:'nivel-bajo', medio:'nivel-medio', alto:'nivel-alto', critico:'nivel-critico' };
  const RIESGO_CLS  = { bajo:'riesgo-bajo', medio:'riesgo-medio', alto:'riesgo-alto', critico:'riesgo-critico' };
  const ESTADO_CLS  = { pendiente:'estado-pendiente', verificado:'estado-verificado', resuelto:'estado-resuelto', descartado:'estado-descartado' };

  let todosReportes = [], zonaMap = {}, tipoMap = {};

  async function cargarReportes() {
    try {
      const [reportes, zonas, tipos] = await Promise.all([
        api('/reportes/mis'),
        api('/zonas'),
        fetch('/auth/tipos').then(r => r.json()),
      ]);
      todosReportes = reportes;
      zonas.forEach(z => zonaMap[z.id_zona] = z);
      tipos.forEach(t => tipoMap[t.id_tipo] = t.nombre);
      renderReportes();
    } catch {
      document.getElementById('reportes-grid').innerHTML =
        '<div class="col-12"><div class="alert alert-danger" style="background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);color:#fca5a5;border-radius:9px">Error al cargar reportes.</div></div>';
    }
  }

  function renderReportes() {
    const grid = document.getElementById('reportes-grid');
    const filtro = document.getElementById('filtro-estado').value;
    const filtrados = filtro ? todosReportes.filter(r => r.estado === filtro) : todosReportes;
    document.getElementById('total-label').textContent = `${filtrados.length} reporte${filtrados.length !== 1 ? 's' : ''}`;

    if (!filtrados.length) {
      grid.innerHTML = `<div class="col-12"><div class="empty-state">
        <i class="bi bi-clipboard-x"></i>
        <p class="fw-semibold mb-1">Sin reportes</p>
        <p style="font-size:.83rem;color:#94a3b8">No tienes reportes con este filtro.</p>
        <a href="reportar.html" class="btn-nuevo" style="margin-top:.5rem"><i class="bi bi-plus-circle"></i>Hacer un reporte</a>
      </div></div>`;
      return;
    }

    grid.innerHTML = filtrados.map(r => {
      const zona       = zonaMap[r.id_zona];
      const tipoNombre = tipoMap[r.id_tipo] || 'Incidente';
      const [icon, iconCls] = TIPO_ICON[tipoNombre] || ['bi-flag', 'tipo-otro'];
      const nivel      = zona?.nivel_riesgo || 'bajo';
      const fecha      = new Date(r.fecha_reporte).toLocaleDateString('es-BO', {day:'2-digit',month:'short',year:'numeric'});
      const hora       = new Date(r.fecha_reporte).toLocaleTimeString('es-BO', {hour:'2-digit',minute:'2-digit'});

      return `<div class="col-12 col-md-6 col-xl-4">
        <div class="reporte-card ${RIESGO_CLS[nivel] || ''}">
          <div class="d-flex align-items-start gap-3 mb-2">
            <div class="tipo-icon ${iconCls}">
              <i class="bi ${icon}"></i>
            </div>
            <div class="flex-grow-1 min-w-0">
              <div class="fw-semibold text-truncate" style="font-size:.88rem;color:#f1f5f9">${tipoNombre}</div>
              <div style="font-size:.74rem;color:#94a3b8">${fecha} · ${hora}</div>
            </div>
            <span class="estado-badge ${ESTADO_CLS[r.estado] || ''}">
              <i class="bi bi-circle-fill" style="font-size:.4rem"></i>${r.estado}
            </span>
          </div>
          ${r.descripcion ? `<p style="font-size:.8rem;color:#94a3b8;margin:0 0 .65rem;line-height:1.5">"${r.descripcion}"</p>` : ''}
          <div class="d-flex align-items-center gap-2 flex-wrap">
            ${zona ? `<span class="nivel-pill ${NIVEL_CLS[nivel]}">${nivel}</span>
            <span style="font-size:.75rem;color:#94a3b8">${zona.nombre}</span>` : ''}
            ${r.anonimo ? `<span class="ms-auto" style="font-size:.72rem;color:#94a3b8"><i class="bi bi-incognito me-1"></i>Anónimo</span>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('filtro-estado').addEventListener('change', renderReportes);

  cargarReportes();
</script>
</body>
</html>
