<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reportar — Santa Cruz Segura</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    :root{--cyan:#00d47a;--cyan-dim:rgba(0,212,122,.1);--border:rgba(255,255,255,.07);--border-acc:rgba(0,212,122,.2);--bg:#060e0a;--surface:rgba(255,255,255,.04);--text:#f1f5f9;--muted:#64748b;--sidebar-w:252px;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);margin:0;}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,212,122,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,122,.025) 1px,transparent 1px);background-size:60px 60px;}

    .sidebar{width:var(--sidebar-w);height:100vh;background:rgba(2,14,7,.97);border-right:1px solid var(--border);position:fixed;top:0;left:0;z-index:1045;display:flex;flex-direction:column;backdrop-filter:blur(20px);}
    .sidebar-brand{padding:1.2rem 1.1rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:.65rem;}
    .sidebar-logo{width:34px;height:34px;border-radius:8px;background:var(--cyan-dim);border:1px solid var(--border-acc);display:flex;align-items:center;justify-content:center;font-size:.9rem;color:var(--cyan);flex-shrink:0;box-shadow:0 0 10px rgba(0,212,122,.15);}
    .sb-name{color:var(--text);font-weight:700;font-size:.86rem;line-height:1.2;}
    .sb-sub{color:var(--muted);font-size:.65rem;letter-spacing:.04em;}
    .sidebar-nav{flex:1;overflow-y:auto;padding:.5rem 0;}
    .nav-link{color:rgba(255,255,255,.5);padding:.55rem .9rem;border-radius:9px;margin:.05rem .4rem;display:flex;align-items:center;gap:.6rem;font-size:.82rem;font-weight:500;text-decoration:none;transition:all .18s;position:relative;}
    .nav-link i{font-size:.88rem;width:16px;text-align:center;}
    .nav-link:hover{color:var(--text);background:var(--surface);}
    .nav-link.active{color:var(--cyan);background:var(--cyan-dim);border:1px solid rgba(0,212,122,.12);}
    .nav-link.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;background:var(--cyan);border-radius:0 2px 2px 0;box-shadow:0 0 8px var(--cyan);}
    .sidebar-footer{padding:.85rem 1.1rem;border-top:1px solid var(--border);flex-shrink:0;}
    .btn-logout{background:none;border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:.3rem .7rem;font-size:.75rem;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;width:100%;}
    .btn-logout:hover{border-color:#f87171;color:#f87171;}

    .mobile-topbar{display:none;position:fixed;top:0;left:0;right:0;height:52px;background:rgba(2,14,7,.97);border-bottom:1px solid var(--border);z-index:1050;align-items:center;justify-content:space-between;padding:0 1rem;backdrop-filter:blur(20px);}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1044;}
    .sidebar-overlay.open{display:block;}

    .main-content{margin-left:var(--sidebar-w);padding:1.5rem;position:relative;z-index:1;}
    #mapa-reportar{height:calc(100vh - 140px);min-height:320px;border-radius:12px;z-index:1;}
    .map-card{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden;}
    .btn-scs{background:linear-gradient(135deg,rgba(0,212,122,.9),rgba(0,212,122,.7));border:none;color:#060e0a;font-weight:700;box-shadow:0 0 20px rgba(0,212,122,.25);}
    .btn-scs:hover{box-shadow:0 0 30px rgba(0,212,122,.4);color:#060e0a;}
    .form-control,.form-select{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:var(--text);border-radius:9px;}
    .form-control:focus,.form-select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,122,.12);background:rgba(255,255,255,.06);color:var(--text);}
    .form-control::placeholder{color:rgba(255,255,255,.2);}
    .form-select option{background:#081a10;}
    .form-label{color:#94a3b8;font-size:.79rem;font-weight:600;letter-spacing:.02em;}
    .modal-content{background:#081510;border:1px solid var(--border);}
    .modal-header-scs{background:rgba(0,212,122,.08);border-bottom:1px solid var(--border-acc);color:var(--cyan);}
    .modal-header-scs .btn-close{filter:invert(1);}
    .modal-body,.modal-footer{background:#081510;}
    .pin-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:999;background:rgba(0,0,0,.8);border:1px solid var(--border);color:var(--text);padding:.4rem 1rem;border-radius:20px;font-size:.8rem;pointer-events:none;white-space:nowrap;backdrop-filter:blur(8px);}
    .tipo-btn{cursor:pointer;transition:all .15s;background:var(--surface)!important;border-color:var(--border)!important;color:var(--text);}
    .tipo-btn:hover,.tipo-btn.selected{border-color:var(--border-acc)!important;background:var(--cyan-dim)!important;color:var(--cyan)!important;box-shadow:0 0 12px rgba(0,212,122,.15);}
    .tipo-btn.selected i,.tipo-btn:hover i{color:var(--cyan)!important;}
    .alert{border-radius:9px;font-size:.82rem;}
    .alert-danger{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);color:#fca5a5;}
    .alert-success{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);color:#6ee7b7;}
    #zona-detectada-info{font-size:.78rem;}

    @media(max-width:991.98px){
      .sidebar{transform:translateX(-100%);transition:transform .28s ease;width:270px;}
      .sidebar.open{transform:translateX(0);box-shadow:0 0 60px rgba(0,0,0,.6);}
      .mobile-topbar{display:flex;}
      .main-content{margin-left:0;padding:1rem;padding-top:calc(52px + 1rem);}
      #mapa-reportar{height:calc(100vh - 190px);min-height:260px;}
    }
    @media(max-width:575.98px){
      .main-content{padding:.75rem;padding-top:calc(52px + .75rem);}
      .page-header{flex-direction:column;align-items:flex-start!important;gap:.5rem;}
      #btn-abrir-reporte{width:100%;}
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- Mobile topbar -->
  <div class="mobile-topbar">
    <button class="btn text-white p-1 lh-1" onclick="openSidebar()">
      <i class="bi bi-list fs-3"></i>
    </button>
    <span class="fw-bold text-white">Reportar incidente</span>
    <span style="width:32px"></span>
  </div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-brand d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <div class="sidebar-logo"><img src="assets/logo.svg" alt="SCS" style="width:22px;height:22px;"/></div>
        <div><div class="sb-name">Santa Cruz</div><div class="sb-sub">SEGURA PREDICTIVA</div></div>
      </div>
      <button class="btn text-white p-0 d-lg-none lh-1 border-0 bg-transparent" onclick="closeSidebar()">
        <i class="bi bi-x-lg" style="font-size:.9rem"></i>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-link" onclick="closeSidebar()"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="reportar.html" class="nav-link active" onclick="closeSidebar()"><i class="bi bi-exclamation-triangle"></i> Reportar</a>
      <a href="mis-reportes.html" class="nav-link" id="link-mis-reportes" onclick="closeSidebar()"><i class="bi bi-list-check"></i> Mis reportes</a>
    <a href="gestionar-reportes.html" class="nav-link d-none" id="link-gestionar" onclick="closeSidebar()"><i class="bi bi-clipboard2-data"></i> Gestionar reportes</a>
      <a href="incidentes.html" class="nav-link d-none" id="link-incidentes" onclick="closeSidebar()"><i class="bi bi-shield-exclamation"></i>Ver incidentes</a>
    <a href="mis-casos.html" class="nav-link d-none" id="link-mis-casos" onclick="closeSidebar()"><i class="bi bi-briefcase"></i>Mis casos</a>
    <a href="alertas.html" class="nav-link" onclick="closeSidebar()"><i class="bi bi-bell"></i> Alertas</a>
      <a href="admin.html" class="nav-link d-none" id="link-admin" onclick="closeSidebar()"><i class="bi bi-people"></i> Usuarios</a>
    </nav>
    <div class="sidebar-footer">
      <button id="btn-logout" class="btn-logout">
        <i class="bi bi-box-arrow-left me-1"></i>Cerrar sesión
      </button>
    </div>
  </div>

  <!-- Main content -->
  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3 page-header flex-wrap gap-2">
      <div>
        <h5 class="fw-bold mb-0">Mapa de incidentes</h5>
        <small class="text-muted"><i class="bi bi-cursor-fill me-1"></i>Haz clic en el mapa para reportar</small>
      </div>
      <button class="btn btn-scs" data-bs-toggle="modal" data-bs-target="#modalReporte" id="btn-abrir-reporte" disabled>
        <i class="bi bi-plus-circle me-2"></i>Reportar aquí
      </button>
    </div>

    <div class="card map-card position-relative">
      <div id="mapa-reportar"></div>
      <div class="pin-hint" id="pin-hint">
        <i class="bi bi-hand-index-thumb me-1"></i>Toca el mapa para seleccionar la ubicación
      </div>
    </div>
  </div>

  <!-- Modal Reporte -->
  <div class="modal fade" id="modalReporte" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content border-0 shadow">
        <div class="modal-header modal-header-scs">
          <h5 class="modal-title fs-6"><i class="bi bi-flag-fill me-2"></i>Nuevo reporte de incidente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-3 p-md-4">
          <form id="reporte-form">
            <div class="mb-3">
              <label class="form-label fw-semibold">Tipo de incidente</label>
              <div class="row g-2" id="tipos-grid"></div>
              <input type="hidden" id="tipo-incidente" required />
            </div>

            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label class="form-label fw-semibold">Zona</label>
                <select id="zona" class="form-select" required>
                  <option value="">Selecciona la zona…</option>
                </select>
                <div id="zona-detectada-info" class="small mt-1"></div>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label fw-semibold">Fecha y hora del incidente</label>
                <input type="datetime-local" id="fecha-incidente" class="form-control" required />
              </div>
            </div>

            <div class="mb-3 mt-3">
              <label class="form-label fw-semibold">Descripción <span class="text-muted fw-normal">(opcional)</span></label>
              <textarea id="descripcion" class="form-control" rows="2" placeholder="Describe brevemente lo ocurrido…"></textarea>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label fw-semibold small">Latitud</label>
                <input type="text" id="latitud-display" class="form-control form-control-sm bg-light" readonly />
              </div>
              <div class="col-6">
                <label class="form-label fw-semibold small">Longitud</label>
                <input type="text" id="longitud-display" class="form-control form-control-sm bg-light" readonly />
              </div>
            </div>

            <div class="row g-3 align-items-start">
              <div class="col-12 col-md-7">
                <label class="form-label fw-semibold">Evidencia <span class="text-muted fw-normal">(imagen/video/audio)</span></label>
                <input type="file" id="evidencia" class="form-control" accept="image/*,video/*,audio/*" />
              </div>
              <div class="col-12 col-md-5 pt-md-4 mt-md-2">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="anonimo" />
                  <label class="form-check-label fw-semibold" for="anonimo">
                    <i class="bi bi-incognito me-1"></i>Reportar anónimamente
                  </label>
                </div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-0 pt-0 flex-column align-items-stretch gap-2">
          <div id="reporte-msg" class="alert alert-success py-2 small mb-0 d-none"></div>
          <div id="reporte-error" class="alert alert-danger py-2 small mb-0 d-none"></div>
          <div class="d-flex gap-2 justify-content-end">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-scs fw-semibold px-4" id="btn-enviar-reporte">
              <i class="bi bi-send me-2"></i>Enviar reporte
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js?v=3"></script>
  <script src="js/reportar.js"></script>
  <script>
    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebar-overlay').classList.add('open');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('open');
    }
  </script>
</body>
</html>
