<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ver Incidentes — Santa Cruz Segura</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    :root{--cyan:#00d47a;--cyan-dim:rgba(0,212,122,.1);--border:rgba(255,255,255,.07);--border-acc:rgba(0,212,122,.2);--bg:#060e0a;--surface:rgba(255,255,255,.04);--text:#f1f5f9;--muted:#64748b;--sidebar-w:252px;--red:#f87171;--yellow:#fbbf24;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);margin:0;}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,212,122,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,122,.025) 1px,transparent 1px);background-size:60px 60px;}
    .sidebar{width:var(--sidebar-w);height:100vh;background:rgba(2,14,7,.97);border-right:1px solid var(--border);position:fixed;top:0;left:0;z-index:1045;display:flex;flex-direction:column;}
    .sidebar-brand{padding:1.2rem 1.1rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.65rem;}
    .sidebar-logo{width:34px;height:34px;border-radius:8px;background:var(--cyan-dim);border:1px solid var(--border-acc);display:flex;align-items:center;justify-content:center;color:var(--cyan);}
    .sb-name{color:var(--text);font-weight:700;font-size:.86rem;line-height:1.2;}
    .sb-sub{color:var(--muted);font-size:.65rem;}
    .sidebar-nav{flex:1;overflow-y:auto;padding:.5rem 0;}
    .nav-link{color:rgba(255,255,255,.5);padding:.55rem .9rem;border-radius:9px;margin:.05rem .4rem;display:flex;align-items:center;gap:.6rem;font-size:.82rem;font-weight:500;text-decoration:none;transition:all .18s;}
    .nav-link:hover{color:var(--text);background:var(--surface);}
    .nav-link.active{color:var(--cyan);background:var(--cyan-dim);border:1px solid rgba(0,212,122,.12);}
    .sidebar-footer{padding:.85rem 1.1rem;border-top:1px solid var(--border);}
    .btn-logout{background:none;border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:.3rem .7rem;font-size:.75rem;cursor:pointer;width:100%;font-family:'Inter',sans-serif;}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1044;}
    .sidebar-overlay.open{display:block;}
    .mobile-topbar{display:none;position:fixed;top:0;left:0;right:0;height:52px;background:rgba(2,14,7,.97);border-bottom:1px solid var(--border);z-index:1050;align-items:center;justify-content:space-between;padding:0 1rem;}
    .main{margin-left:var(--sidebar-w);padding:1.5rem;min-height:100vh;position:relative;z-index:1;}
    .card-incidente{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.2rem;margin-bottom:.75rem;transition:border-color .2s;}
    .card-incidente:hover{border-color:var(--border-acc);}
    .dist-badge{background:rgba(0,212,122,.12);color:var(--cyan);border:1px solid rgba(0,212,122,.2);border-radius:20px;padding:.2rem .6rem;font-size:.72rem;font-weight:700;}
    .tipo-tag{background:rgba(255,255,255,.06);color:#94a3b8;border-radius:6px;padding:.15rem .45rem;font-size:.72rem;}
    .btn-asignar{background:linear-gradient(135deg,rgba(0,212,122,.9),rgba(0,212,122,.7));border:none;color:#060e0a;font-weight:700;border-radius:8px;padding:.4rem 1rem;font-size:.8rem;cursor:pointer;font-family:'Inter',sans-serif;}
    .btn-asignar:disabled{opacity:.5;cursor:not-allowed;}
    .empty-state{text-align:center;padding:3rem 1rem;color:var(--muted);}
    @media(max-width:991.98px){.sidebar{transform:translateX(-100%);transition:transform .28s;width:270px;}.sidebar.open{transform:translateX(0);box-shadow:0 0 60px rgba(0,0,0,.6);}.mobile-topbar{display:flex;}.main{margin-left:0;padding-top:calc(52px + 1rem);}}
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
  <div class="mobile-topbar">
    <button class="btn text-white p-1" onclick="openSidebar()"><i class="bi bi-list fs-3"></i></button>
    <span class="fw-bold">Ver Incidentes</span>
    <span style="width:32px"></span>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo"><img src="assets/logo.svg" style="width:20px"/></div>
      <div><div class="sb-name">Santa Cruz</div><div class="sb-sub">SEGURA PREDICTIVA</div></div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-link" onclick="closeSidebar()"><i class="bi bi-speedometer2"></i>Dashboard</a>
      <a href="reportar.html" class="nav-link" id="link-reportar" onclick="closeSidebar()"><i class="bi bi-exclamation-triangle"></i>Reportar incidente</a>
      <a href="mis-reportes.html" class="nav-link" id="link-mis-reportes" onclick="closeSidebar()"><i class="bi bi-list-check"></i>Mis reportes</a>
      <a href="gestionar-reportes.html" class="nav-link d-none" id="link-gestionar" onclick="closeSidebar()"><i class="bi bi-clipboard2-data"></i>Gestionar reportes</a>
      <a href="incidentes.html" class="nav-link active d-none" id="link-incidentes" onclick="closeSidebar()"><i class="bi bi-shield-exclamation"></i>Ver incidentes</a>
      <a href="mis-casos.html" class="nav-link d-none" id="link-mis-casos" onclick="closeSidebar()"><i class="bi bi-briefcase"></i>Mis casos</a>
      <a href="alertas.html" class="nav-link" onclick="closeSidebar()"><i class="bi bi-bell"></i>Alertas</a>
      <a href="admin.html" class="nav-link d-none" id="link-admin" onclick="closeSidebar()"><i class="bi bi-people"></i>Usuarios</a>
    </nav>
    <div class="sidebar-footer">
      <button id="btn-logout" class="btn-logout"><i class="bi bi-box-arrow-left me-1"></i>Cerrar sesión</button>
    </div>
  </div>

  <div class="main">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div>
        <h5 class="fw-bold mb-0"><i class="bi bi-shield-exclamation me-2" style="color:var(--cyan)"></i>Incidentes cercanos</h5>
        <small class="text-muted">Ordenados por distancia a tu ubicación actual</small>
      </div>
      <button class="btn btn-sm" onclick="cargarIncidentes()"
        style="background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:.8rem">
        <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
      </button>
    </div>

    <div id="gps-banner" style="display:none;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2);
         color:#fbbf24;border-radius:10px;padding:.6rem 1rem;font-size:.83rem;margin-bottom:1rem">
      <i class="bi bi-geo-alt me-1"></i>Obteniendo tu ubicación GPS…
    </div>

    <div id="lista-incidentes">
      <div class="empty-state"><div class="spinner-border" style="color:var(--cyan)"></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js?v=4"></script>
  <script>
    requireAuth(['autoridad', 'admin']);
    function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebar-overlay').classList.add('open');}
    function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebar-overlay').classList.remove('open');}

    const NIVEL_COLOR = {bajo:'#34d399',medio:'#fbbf24',alto:'#f87171',critico:'#a78bfa'};
    let miLat = null, miLng = null;

    function formatDist(m) {
      return m < 1000 ? `${Math.round(m)} m` : `${(m/1000).toFixed(1)} km`;
    }

    function renderIncidentes(incidentes) {
      const el = document.getElementById('lista-incidentes');
      if (!incidentes.length) {
        el.innerHTML = `<div class="empty-state">
          <i class="bi bi-shield-check" style="font-size:2.5rem;color:var(--cyan);display:block;margin-bottom:.75rem"></i>
          <p style="margin:0">No hay incidentes pendientes en este momento</p>
        </div>`;
        return;
      }
      el.innerHTML = incidentes.map(r => {
        const color = NIVEL_COLOR[r.zona?.nivel_riesgo] || '#94a3b8';
        const hace = timeSince(r.fecha_reporte);
        return `
        <div class="card-incidente">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
              <span class="tipo-tag me-1">${r.tipo_nombre || '—'}</span>
              <span class="dist-badge"><i class="bi bi-geo-alt me-1"></i>${formatDist(r.distancia_metros)}</span>
            </div>
            <small style="color:var(--muted)">${hace}</small>
          </div>
          <div style="font-weight:600;margin-bottom:.3rem">${r.zona_nombre || '—'}</div>
          ${r.descripcion ? `<p style="color:#94a3b8;font-size:.82rem;margin-bottom:.6rem">${r.descripcion}</p>` : ''}
          <div class="d-flex justify-content-between align-items-center">
            <small style="color:var(--muted)">
              <i class="bi bi-geo me-1"></i>${parseFloat(r.latitud).toFixed(5)}, ${parseFloat(r.longitud).toFixed(5)}
            </small>
            <button class="btn-asignar" id="btn-${r.id_reporte}" onclick="asignarme(${r.id_reporte})">
              <i class="bi bi-person-check me-1"></i>Asignarme este caso
            </button>
          </div>
        </div>`;
      }).join('');
    }

    function timeSince(dateStr) {
      const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000);
      if (diff < 60) return 'Hace un momento';
      if (diff < 3600) return `Hace ${Math.floor(diff/60)} min`;
      if (diff < 86400) return `Hace ${Math.floor(diff/3600)} h`;
      return `Hace ${Math.floor(diff/86400)} días`;
    }

    async function cargarIncidentes() {
      if (!miLat) { await obtenerUbicacion(); return; }
      try {
        const data = await api(`/reportes/incidentes?lat=${miLat}&lng=${miLng}`);
        renderIncidentes(data);
      } catch(e) {
        document.getElementById('lista-incidentes').innerHTML =
          `<div class="empty-state" style="color:var(--red)">${e.message}</div>`;
      }
    }

    async function asignarme(id) {
      const btn = document.getElementById('btn-' + id);
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" style="width:.7rem;height:.7rem"></span>Asignando…';
      try {
        await api(`/reportes/${id}/asignar`, { method: 'POST' });
        btn.innerHTML = '<i class="bi bi-check-circle me-1"></i>¡Caso asignado!';
        btn.style.background = 'rgba(52,211,153,.2)';
        btn.style.color = '#34d399';
        setTimeout(() => cargarIncidentes(), 1500);
      } catch(e) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-person-check me-1"></i>Asignarme este caso';
        alert(e.message);
      }
    }

    function obtenerUbicacion() {
      return new Promise(resolve => {
        if (!navigator.geolocation) { resolve(); return; }
        document.getElementById('gps-banner').style.display = 'block';
        navigator.geolocation.getCurrentPosition(pos => {
          miLat = pos.coords.latitude;
          miLng = pos.coords.longitude;
          document.getElementById('gps-banner').style.display = 'none';
          cargarIncidentes();
          resolve();
        }, () => {
          // Sin GPS: usar centro de Santa Cruz
          miLat = -17.7834; miLng = -63.1821;
          document.getElementById('gps-banner').style.display = 'none';
          cargarIncidentes();
          resolve();
        }, { enableHighAccuracy: true, timeout: 8000 });
      });
    }

    obtenerUbicacion();
    setInterval(() => { if (miLat) cargarIncidentes(); }, 30000);
  </script>
</body>
</html>
